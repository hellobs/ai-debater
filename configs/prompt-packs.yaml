# 领域提示词包：辩题的 domain → 用哪一套参谋措辞。
#
# 为什么要这一步
# --------------
# 在此之前提示词模板只有一份，措辞按法学写（「法律涵摄」「法源不稳」「法条名称+条款号」）。
# 于是通用辩题下五路参谋也拿法律框架思考 —— 这是「通用平台」里最后一处与法学绑死的地方，
# 而且它不报错，只是让输出悄悄换了个学科视角。包把「领域措辞」从渲染链路里拆出来：
#
#     prompts/layout.txt                  总装骨架（与领域无关，共享）
#     prompts/packs/<pack>/roles/<name>   角色指令
#     prompts/packs/<pack>/tasks/<name>   本次任务
#
# 谁用哪个包：辩题的 `domain`（见 topics.yaml）按**精确匹配**落到一个包；
# 没被任何包认领的 domain 落到 `default`。
#
# 字段
#   default  兜底包名，必须存在于 packs 里。
#   packs[]  一个包 = 一份**自包含**的 roles/ + tasks/，位于 prompts/packs/<name>/。
#     name     目录名，必须与 prompts/packs/ 下的目录同名。
#     label    界面上显示的名字。
#     hint     一句话说明这个包把参谋往哪个框架上带。
#     domains  认领的辩题 domain 列表。空列表表示「不主动认领，只当兜底」。
#
# 为什么是精确匹配 + 兜底包，而不是关键词猜测
# ------------------------------------------
# 猜错时提示词会安静地换成另一套框架，而输出照样像模像样 —— 那是最难发现的一类错。
# 宁可落到 default（并在日志里说一声），也不要猜。
#
# 两个包里的文件允许逐字节相同（例如 auditor / questioner 本就与领域无关）。
# 那不是重复：一个包之所以能脱离另一个包被独立替换，前提就是它自带完整的 5×2 份模板。
# 少一份就在启动自检里当场报错（backend/app/advisors/base.py 的 preload）。

default: general

packs:
  # 不预设任何学科框架。新辩题没人认领时走这里。
  - name: general
    label: 通用
    hint: 三段论 / 衡量尺度 / 依据核验，不预设学科框架。
    domains:
      - 通用
      - 我的辩题

  # 法律涵摄 + 法律解释方法之争。
  - name: legal
    label: 法学
    hint: 法律涵摄（大前提=法律规范）与法律解释方法（文义 / 体系 / 目的 / 历史 / 合宪性）。
    domains:
      - AI + 法学
      - 法学
