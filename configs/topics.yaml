# 辩题库（入仓预设，开箱即用）。
#
# **这里只放「AI 与法学」衍生出的辩题** —— 平台是通用辩手参谋台，但它的落地面
# 就在这条线上，预设库就该聚焦，不要拿几条无关辩题充数。其他领域请自由输入
# （不选预设辩题即可），或写进 data/topics.json（本机，不入仓）。
#
# 为什么不再放通用辩题：通用辩题的用途是验证"平台不依赖法学也能用"，
# 但那份验证由提示词包的**兜底路径**承担 —— 自由输入时 domain 为空，
# 落到 `general` 包（见 configs/prompt-packs.yaml）。预设库里摆几条无关辩题，
# 只会让使用者在下拉框里先读到不相关的东西。
#
# 字段
#   id             稳定标识（小写字母/数字/短横线）。前端拿它做选中主键，
#                  所以改标题不会丢选中。留空则按标题自动生成。
#   title          辩题本身（一句话，正反都能辩）。
#   domain         场景分组，前端按下拉分组展示。**本库统一为「AI + 法学」**，
#                  由 legal 提示词包认领（精确匹配，见 prompt-packs.yaml）。
#   side_a/side_b  双方立场。side_a 是选定辩题后的默认我方立场。
#                  本库按模拟法庭的语境写成「控方 / 辩方」：控方主张"应当/成立"。
#   opponent_hint  可选。对方最可能的第一句话，用于「对方刚说的话」一键填充。
#                  要求是**真会出现的强反驳**，不是稻草人；且不写具体法条号 ——
#                  那正是要交给引用核验去查的东西，凭记忆写会固化成错误。
#   note           可选。一句话争点说明。**别以「争点」二字开头** —— 界面会自动加前缀。
#
# 本机自建的辩题写在 data/topics.json（**不入仓**，与 ledger.db / corpus 同一约定），
# 运行时与这里并集返回；同 id 时本机覆盖预设。

topics:
  # ---- 著作权 ----
  - id: ai-copyright
    domain: AI + 法学
    title: AI 生成内容是否应享有著作权
    side_a: 控方（主张应享有）
    side_b: 辩方（主张不应享有）
    opponent_hint: 著作权保护的是人的智力创作，AI 不是法律主体，既不能享有权利也无法承担义务，把权利给它等于让制度失去对象。
    note: 独创性的判断落点（是否为"人的创作"）与权利主体适格性，二者何者优先。

  - id: ai-training-fair-use
    domain: AI + 法学
    title: 用受著作权保护的作品训练 AI 应当被认定为合理使用
    side_a: 控方（主张构成合理使用）
    side_b: 辩方（主张不构成合理使用）
    opponent_hint: 训练第一步就是把作品整体复制进数据集，这是最典型的复制权行使；生成结果还在市场上直接替代原作，谈不上"转换性使用"。
    note: 转换性使用与"市场替代"的衡量，以及文本与数据挖掘例外的边界。

  # ---- 专利 ----
  - id: ai-inventor
    domain: AI + 法学
    title: AI 自主生成的技术方案，可以将 AI 列为发明人
    side_a: 控方（主张可以列）
    side_b: 辩方（主张不可以列）
    opponent_hint: 专利制度激励的是作出发明的自然人，机器既不能享有专利权也无法承担义务，让 AI 当发明人只会让权利归属悬空。
    note: 发明人适格性与专利制度的激励对象，以及"创造性"的来源认定。

  # ---- 侵权与产品责任 ----
  - id: ai-liability
    domain: AI + 法学
    title: 自动驾驶致损应当由生产者承担无过错责任
    side_a: 控方（主张应承担）
    side_b: 辩方（主张不应承担）
    opponent_hint: 使用者才是车辆的支配者与运行利益的归属者，把责任全推给生产者会消解使用者的注意义务，还会把成本摊到所有买家身上。
    note: 控制力标准与风险分散能力何者应优先；产品责任与机动车责任的竞合。

  # ---- 人格权与平台责任 ----
  - id: deepfake-platform
    domain: AI + 法学
    title: 深度伪造侵害他人肖像时，平台应当承担连带责任
    side_a: 控方（主张应当承担）
    side_b: 辩方（主张不应当承担）
    opponent_hint: 平台既没有专业能力也没有法律授权去逐条鉴定伪造内容，强加审查义务只会逼它对所有内容一刀切过滤，最后伤及正常表达。
    note: 平台注意义务的边界、技术中立能否免责，以及救济效率与表达自由的权衡。

  # ---- 个人信息与公法 ----
  - id: face-recognition-public
    domain: AI + 法学
    title: 公共场所的大规模人脸识别应当被禁止
    side_a: 控方（主张应当禁止）
    side_b: 辩方（主张不应当禁止）
    opponent_hint: 人脸识别采集的和监控录像拍到的本就是同一种公开信息，禁止前者却允许后者，等于按技术先进程度而不是按侵害程度划线。
    note: 比例原则下的"必要性"判断，以及同意机制在公共场景是否已经失灵。

  # ---- 竞争法与消费者 ----
  - id: ai-price-discrimination
    domain: AI + 法学
    title: 算法实施的差异化定价应当受法律规制
    side_a: 控方（主张应当规制）
    side_b: 辩方（主张不应当规制）
    opponent_hint: 差别定价本来就是正常的市场细分，老年人折扣、学生票同理；按"成本"以外的理由管价格，反而会削弱竞争。
    note: 规制对象是"剥削性损害"还是"竞争损害"，以及个体举证不能时该由谁举证。

  # ---- 刑事与正当程序 ----
  - id: ai-sentencing
    domain: AI + 法学
    title: 量刑辅助系统的算法结论可以作为裁判的说理依据
    side_a: 控方（主张可以作为）
    side_b: 辩方（主张不可以作为）
    opponent_hint: 量刑指导意见本就是统一的量化规则，算法只是算得更准；只要法官仍然独立裁判，就不存在把裁判权交给机器的问题。
    note: 算法可解释性与正当程序对"说理"的要求，以及裁判亲历性能否被统计替代。

  # ---- 行政监管 ----
  - id: algorithm-transparency
    domain: AI + 法学
    title: 平台的算法推荐应当向监管公开源代码
    side_a: 控方（主张应当公开）
    side_b: 辩方（主张不应当公开）
    opponent_hint: 源代码是核心商业秘密，强制公开会摧毁企业的创新激励；监管想验证效果，用输出端的测试比审代码更直接。
    note: 监管有效性手段与商业秘密保护的权衡，以及"可审计"是否等于"可公开"。

  # ---- 证据 ----
  - id: ai-generated-evidence
    domain: AI + 法学
    title: AI 生成的内容应当被推定不具有证据能力
    side_a: 控方（主张应当推定不具）
    side_b: 辩方（主张不应当推定）
    opponent_hint: 可采性从来是鉴真技术问题，不是证据种类问题；先推定不可采，等于用一条规则去解决本该由鉴定和质证解决的问题。
    note: 鉴真规则能否覆盖生成式伪造，以及证明力判断与证据能力判断的分工。

  # ---- 生成式 AI 与平台责任 ----
  - id: ai-output-review-duty
    domain: AI + 法学
    title: 生成式 AI 服务提供者应当对其输出内容承担与出版者相当的审核责任
    side_a: 控方（主张应当承担）
    side_b: 辩方（主张不应当承担）
    opponent_hint: 平台把内容推给公众并靠订阅和广告营利，收钱的时候是出版者，出了事就改口说自己是"技术中立"，天下没有这么算账的道理。
    note: 服务提供者注意义务的边界，"技术中立"抗辩在主动生成场景下还剩多少空间。

  # ---- 刑事 ----
  - id: ai-deepfake-criminalize
    domain: AI + 法学
    title: 利用 AI 深度合成伪造他人肖像视频，应当单独入刑
    side_a: 控方（主张应当入刑）
    side_b: 辩方（主张不应入刑）
    opponent_hint: 伪造视频赔钱、拘留都够了，为一段几秒钟的影像动用刑罚，是刑法谦抑性的失败；真正该管的是传播造成的实害。
    note: 现有罪名能否涵摄深度合成行为，以及单独入刑与法益保护前置的争议。

  - id: autonomous-driving-liability
    domain: AI + 法学
    title: 高等级自动驾驶汽车致人伤亡，刑事责任应当由制造商承担
    side_a: 控方（主张由制造商承担）
    side_b: 辩方（主张由使用人承担）
    opponent_hint: 系统接管期间驾驶人的手只是摆设，让他为算法的瞬间决策坐牢，而厂商最多召回——权责天平彻底歪了。
    note: 注意义务的归属与信赖原则的适用边界，产品责任与交通肇事罪如何衔接。

  # ---- 侵权与人格权 ----
  - id: ai-diagnosis-liability
    domain: AI + 法学
    title: AI 辅助诊断出现误诊，损害赔偿责任应当由医院对患方承担
    side_a: 控方（主张由医院承担）
    side_b: 辩方（主张不应由医院单独承担）
    opponent_hint: AI 只是辅助参考，最终签字拍板的是执业医师本人；把误诊全算在医院头上，等于让背书工具的人替工具赔一辈子。
    note: 医疗损害责任的主体界定，以及"辅助"定位下的注意义务在医生、医院与厂商之间的分配。

  - id: digital-human-consent
    domain: AI + 法学
    title: 用逝者生前的对话数据训练"数字人"供亲属交流，应当以近亲属一致同意为前提
    side_a: 控方（主张应当一致同意）
    side_b: 辩方（主张无需一致同意）
    opponent_hint: 聊天记录和语音本就是一家人共同的记忆，做个纪念性质的数字人还要所有亲属签字，是把亲情逼成诉讼。
    note: 死者个人信息保护的请求权主体，以及生者人格利益与近亲属哀思利益的冲突。

  # ---- 数据与竞争 ----
  - id: ai-training-scraping
    domain: AI + 法学
    title: 大规模爬取公开网页数据用于训练大模型构成不正当竞争
    side_a: 控方（主张构成）
    side_b: 辩方（主张不构成）
    opponent_hint: 数据就公开摆在那，机器人看一眼怎么就"不正当"了？照这个逻辑搜索引擎、学术数据库全都违法。
    note: 公开数据的权属边界、爬取行为"实质性替代"的认定，与数据流通价值的平衡。

  # ---- 司法与法律执业 ----
  - id: ai-pleading-tool-duty
    domain: AI + 法学
    title: 律师使用 AI 起草文书出现虚构引注，应当对客户承担违约赔偿责任
    side_a: 控方（主张应当承担）
    side_b: 辩方（主张不应当承担）
    opponent_hint: 律师逐字审过稿才交给客户，AI 造假属于执业过程中的一般风险，让律所赔等于把工具缺陷算成人的过错。
    note: 执业注意义务在 AI 工具场景下的内容变化，核实义务能否被"工具依赖"减免。

  # ---- 劳动与平台用工 ----
  - id: ai-algorithm-firing
    domain: AI + 法学
    title: 平台以算法评估结果为由解雇骑手，应当被认定为违法解除
    side_a: 控方（主张构成违法解除）
    side_b: 辩方（主张不构成违法解除）
    opponent_hint: 评估规则事前公开、分数实时可查，骑手自己跑了多少单心里有数，按规则解雇怎么就违法了？
    note: 算法用工下解雇正当事由的认定，以及劳动者对算法规则的知情与申辩权。

  # ---- 消费者与格式条款 ----
  - id: ai-tos-robot-clause
    domain: AI + 法学
    title: "「AI 生成内容仅供参考、不构成建议」的免责条款应当被认定为无效"
    side_a: 控方（主张无效）
    side_b: 辩方（主张有效）
    opponent_hint: 医药说明书写得再全也没人靠它治病，用户对 AI 输出自有判断义务；一句免责声明挡不住真正的过错责任。
    note: 格式条款的效力控制，以及"重大利益建议"场景下提示说明义务的充分性。

  # ---- 国际法与规制竞争 ----
  - id: ai-model-export-control
    domain: AI + 法学
    title: 强开源大模型的跨境发布应当纳入出口管制
    side_a: 控方（主张应当纳入）
    side_b: 辩方（主张不应纳入）
    opponent_hint: 权重一旦下载就管不住了，管制发布等于管制空气；真正该管的是算力和应用端，不是一份文件。
    note: 开源权重可管制性的技术前提，与国家安全、学术自由之间的边界。
