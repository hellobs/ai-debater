# 辩题库（入仓预设，开箱即用）。
#
# **这里只放「AI 与法学」衍生出的辩题** —— 平台是通用辩手参谋台，但它的落地面
# 就在这条线上，预设库就该聚焦，不要拿几条无关辩题充数。其他领域请自由输入
# （不选预设辩题即可），或写进 data/topics.json（本机，不入仓）。
#
# 为什么不再放通用辩题：通用辩题的用途是验证"平台不依赖法学也能用"，
# 但那份验证由提示词包的**兜底路径**承担 —— 自由输入时 domain 为空，
# 落到 `general` 包（见 configs/prompt-packs.yaml）。预设库里摆几条无关辩题，
# 只会让使用者在下拉框里先读到不相关的东西。
#
# 字段
#   id             稳定标识（小写字母/数字/短横线）。前端拿它做选中主键，
#                  所以改标题不会丢选中。留空则按标题自动生成。
#   title          辩题本身（一句话，正反都能辩）。
#   domain         场景分组，前端按下拉分组展示。**本库统一为「AI + 法学」**，
#                  由 legal 提示词包认领（精确匹配，见 prompt-packs.yaml）。
#   side_a/side_b  双方立场。side_a 是选定辩题后的默认我方立场。
#                  本库按模拟法庭的语境写成「控方 / 辩方」：控方主张"应当/成立"。
#   opponent_hint  可选。对方最可能的第一句话，用于「对方刚说的话」一键填充。
#                  要求是**真会出现的强反驳**，不是稻草人；且不写具体法条号 ——
#                  那正是要交给引用核验去查的东西，凭记忆写会固化成错误。
#   note           可选。一句话争点说明。**别以「争点」二字开头** —— 界面会自动加前缀。
#
# 本机自建的辩题写在 data/topics.json（**不入仓**，与 ledger.db / corpus 同一约定），
# 运行时与这里并集返回；同 id 时本机覆盖预设。

topics:
  # ---- 著作权 ----
  - id: ai-copyright
    domain: AI + 法学
    title: AI 生成内容是否应享有著作权
    side_a: 控方（主张应享有）
    side_b: 辩方（主张不应享有）
    opponent_hint: 著作权保护的是人的智力创作，AI 不是法律主体，既不能享有权利也无法承担义务，把权利给它等于让制度失去对象。
    note: 独创性的判断落点（是否为"人的创作"）与权利主体适格性，二者何者优先。

  - id: ai-training-fair-use
    domain: AI + 法学
    title: 用受著作权保护的作品训练 AI 应当被认定为合理使用
    side_a: 控方（主张构成合理使用）
    side_b: 辩方（主张不构成合理使用）
    opponent_hint: 训练第一步就是把作品整体复制进数据集，这是最典型的复制权行使；生成结果还在市场上直接替代原作，谈不上"转换性使用"。
    note: 转换性使用与"市场替代"的衡量，以及文本与数据挖掘例外的边界。

  # ---- 专利 ----
  - id: ai-inventor
    domain: AI + 法学
    title: AI 自主生成的技术方案，可以将 AI 列为发明人
    side_a: 控方（主张可以列）
    side_b: 辩方（主张不可以列）
    opponent_hint: 专利制度激励的是作出发明的自然人，机器既不能享有专利权也无法承担义务，让 AI 当发明人只会让权利归属悬空。
    note: 发明人适格性与专利制度的激励对象，以及"创造性"的来源认定。

  # ---- 侵权与产品责任 ----
  - id: ai-liability
    domain: AI + 法学
    title: 自动驾驶致损应当由生产者承担无过错责任
    side_a: 控方（主张应承担）
    side_b: 辩方（主张不应承担）
    opponent_hint: 使用者才是车辆的支配者与运行利益的归属者，把责任全推给生产者会消解使用者的注意义务，还会把成本摊到所有买家身上。
    note: 控制力标准与风险分散能力何者应优先；产品责任与机动车责任的竞合。

  # ---- 人格权与平台责任 ----
  - id: deepfake-platform
    domain: AI + 法学
    title: 深度伪造侵害他人肖像时，平台应当承担连带责任
    side_a: 控方（主张应当承担）
    side_b: 辩方（主张不应当承担）
    opponent_hint: 平台既没有专业能力也没有法律授权去逐条鉴定伪造内容，强加审查义务只会逼它对所有内容一刀切过滤，最后伤及正常表达。
    note: 平台注意义务的边界、技术中立能否免责，以及救济效率与表达自由的权衡。

  # ---- 个人信息与公法 ----
  - id: face-recognition-public
    domain: AI + 法学
    title: 公共场所的大规模人脸识别应当被禁止
    side_a: 控方（主张应当禁止）
    side_b: 辩方（主张不应当禁止）
    opponent_hint: 人脸识别采集的和监控录像拍到的本就是同一种公开信息，禁止前者却允许后者，等于按技术先进程度而不是按侵害程度划线。
    note: 比例原则下的"必要性"判断，以及同意机制在公共场景是否已经失灵。

  # ---- 竞争法与消费者 ----
  - id: ai-price-discrimination
    domain: AI + 法学
    title: 算法实施的差异化定价应当受法律规制
    side_a: 控方（主张应当规制）
    side_b: 辩方（主张不应当规制）
    opponent_hint: 差别定价本来就是正常的市场细分，老年人折扣、学生票同理；按"成本"以外的理由管价格，反而会削弱竞争。
    note: 规制对象是"剥削性损害"还是"竞争损害"，以及个体举证不能时该由谁举证。

  # ---- 刑事与正当程序 ----
  - id: ai-sentencing
    domain: AI + 法学
    title: 量刑辅助系统的算法结论可以作为裁判的说理依据
    side_a: 控方（主张可以作为）
    side_b: 辩方（主张不可以作为）
    opponent_hint: 量刑指导意见本就是统一的量化规则，算法只是算得更准；只要法官仍然独立裁判，就不存在把裁判权交给机器的问题。
    note: 算法可解释性与正当程序对"说理"的要求，以及裁判亲历性能否被统计替代。

  # ---- 行政监管 ----
  - id: algorithm-transparency
    domain: AI + 法学
    title: 平台的算法推荐应当向监管公开源代码
    side_a: 控方（主张应当公开）
    side_b: 辩方（主张不应当公开）
    opponent_hint: 源代码是核心商业秘密，强制公开会摧毁企业的创新激励；监管想验证效果，用输出端的测试比审代码更直接。
    note: 监管有效性手段与商业秘密保护的权衡，以及"可审计"是否等于"可公开"。

  # ---- 证据 ----
  - id: ai-generated-evidence
    domain: AI + 法学
    title: AI 生成的内容应当被推定不具有证据能力
    side_a: 控方（主张应当推定不具）
    side_b: 辩方（主张不应当推定）
    opponent_hint: 可采性从来是鉴真技术问题，不是证据种类问题；先推定不可采，等于用一条规则去解决本该由鉴定和质证解决的问题。
    note: 鉴真规则能否覆盖生成式伪造，以及证明力判断与证据能力判断的分工。
