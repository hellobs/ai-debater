# 辩题库（入仓预设，开箱即用）。
#
# 此前辩题是前端写死的一个常量，只能手输、无法预置。
# 现在改成"提前配置"：辩题与它的双方立场绑在一起，选定辩题即带出立场。
#
# 字段
#   id             稳定标识（小写字母/数字/短横线）。前端拿它做选中主键，
#                  所以改标题不会丢选中。留空则按标题自动生成。
#   title          辩题本身（一句话，正反都能辩）。
#   domain         场景分组，前端按下拉分组展示。默认「通用」。
#   side_a/side_b  双方立场。side_a 是选定辩题后的默认我方立场。
#   opponent_hint  可选。对方最可能的第一句话，用于「对方刚说的话」一键填充。
#   note           可选。一句话争点说明。**别以「争点」二字开头** —— 界面会自动加前缀。
#
# 本机自建的辩题写在 data/topics.json（**不入仓**，与 ledger.db / corpus 同一约定），
# 运行时与这里并集返回；同 id 时本机覆盖预设。

topics:
  # ------------------------------------------------------------------
  # 通用：与领域无关的辩题，验证平台不依赖「法学」也能用。
  # ------------------------------------------------------------------
  - id: ai-mandatory-course
    domain: 通用
    title: 大学应当把人工智能设为必修课
    side_a: 正方（应当必修）
    side_b: 反方（不应当必修）
    opponent_hint: 大学教育的价值在于通识与人格养成，把一门还在快速迭代的技术课设为必修，是用短期就业焦虑绑架四年学制。
    note: 「教育目的」与「技能时效性」的边界。

  - id: homework-ai-allowed
    domain: 通用
    title: 学生使用 AI 完成作业应当被允许
    side_a: 正方（应当允许）
    side_b: 反方（不应当允许）
    opponent_hint: 作业的意义在于训练思维过程，让 AI 代劳等于跳过了训练本身，交上来的只是一份无法证明归属的答案。
    note: 「工具使用」与「能力形成」是否可分离。

  - id: city-centralization
    domain: 通用
    title: 特大城市应当继续扩张
    side_a: 正方（应当扩张）
    side_b: 反方（不应当扩张）
    opponent_hint: 城市规模扩大带来的是通勤、房价与公共服务的系统性超载，边际收益早已为负。
    note: 规模效应与治理成本的临界位置。

  # ------------------------------------------------------------------
  # AI + 法学：平台的最终落地场景。
  # ------------------------------------------------------------------
  - id: ai-copyright
    domain: AI + 法学
    title: AI 生成内容是否应享有著作权
    side_a: 控方（主张应享有）
    side_b: 辩方（主张不应享有）
    opponent_hint: 著作权法只保护自然人的智力成果，AI 不是人，所以 AI 生成内容不应享有著作权。
    note: 独创性判断标准与权利主体适格性。

  - id: ai-liability
    domain: AI + 法学
    title: 自动驾驶致损应当由生产者承担无过错责任
    side_a: 控方（主张应承担）
    side_b: 辩方（主张不应承担）
    opponent_hint: 使用者才是车辆的支配者与运行利益的归属者，把责任全推给生产者会消解使用者的注意义务。
    note: 控制力标准与风险分散能力何者应优先。

  - id: algorithm-transparency
    domain: AI + 法学
    title: 平台的算法推荐应当向监管公开源代码
    side_a: 控方（主张应当公开）
    side_b: 辩方（主张不应当公开）
    opponent_hint: 源代码是核心商业秘密，强制公开会摧毁企业的创新激励，监管完全可以用效果测试替代代码审查。
    note: 监管有效性手段与商业秘密保护的权衡。
