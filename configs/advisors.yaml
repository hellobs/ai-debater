# 参谋团名册。
#
# 这里是名册的**唯一来源**：前端不再抄一份，改为读 /api/health 返回的元数据。
#
# 字段
#   name     必须与 backend/app/advisors/*.py 里的类属性同名，否则该条目被忽略。
#   enabled  false = 本次不跑这一路（定义仍留在代码里，随时能开回来）。
#   label    可选。覆盖前端显示名。
#   kind     可选。覆盖结果形状（决定前端用哪种卡片渲染）。改动前先确认前端支持。
#   domain   可选。场景领域，空 = 通用。用于标出「这一路是某个场景专用的」。
#
# ⚠️ 列表顺序即前端展示顺序 —— 想调顺序就挪行，不需要额外的 order 字段。
# ⚠️ 把 enabled 全改成 false 会让本次分析跑零路参谋（后端会告警，不会偷偷改回全开）——
#    这是刻意的：静默改回全开会在你不知情时多花五次上游调用。

advisors:
  - name: rebutter
    label: 反驳手
    enabled: true

  - name: questioner
    label: 质询手
    enabled: true

  - name: auditor
    label: 逻辑审计员
    enabled: true

  # 解释方法之争（交接文档 §3.4）：文义 / 体系 / 目的 / 历史 / 合宪性解释。
  # 这是五路里唯一与法学深度绑定的一路 —— 它的指令直接以「法律解释方法」为对象。
  # 通用辩题下它的价值会打折，`domain` 如实标出来，前端会显示为法学专用。
  # （让它按辩题场景自动上场/下场，属于提示词层的领域解耦，尚未开工。）
  - name: strategist
    label: 解释方法策略师
    enabled: true
    domain: 法学

  # 唱反调：对方陷阱 / 我方薄弱 / 事实不清 / 法源不稳
  - name: risk
    label: 风险提示员
    enabled: true
