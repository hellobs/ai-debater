name: CI

# 全部检查都是**离线计算**：pytest 不调任何模型、不计费；前端只做类型检查与构建。
# 这正是本项目"0 消耗回归"纪律的直接受益——可以放心在每次 push 上跑。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # backend 必须跑 Windows：mavis 以**编译黑箱 wheel** 分发（vendor/ 下，
    # cp313-win_amd64 平台标签，见 docs/mavis-blackbox-build.md），只能装在
    # Windows + CPython 3.13 上——这恰好也是学生机的真实形态，CI 测的就是它。
    # 早期写法（pip install git+https://mavis 仓库）在匿名 clone 私有仓库时
    # 拿不到凭据，是 CI 长期全红的根因；换 vendor wheel 后零网络依赖。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # --find-links 按 名字+版本 从 vendor/ 解析 wheel，不依赖 shell 通配符
      - name: Install mavis (vendor black-box wheel, pinned 1.3.3)
        run: pip install --find-links=vendor mavisframework==1.3.3

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # npm run build = tsc --noEmit && vite build（类型检查 + 构建）
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
