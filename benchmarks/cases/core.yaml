# 回归用例集
#
# 用途：固定辩题 + 固定对方发言，跑同一批用例来对比"改动到底变好还是只是变长了"。
# 说明见 benchmarks/README.md。
#
# 字段：
#   id             唯一标识
#   topic          辩题
#   our_side       我方立场
#   opponent_text  对方的一段真实感发言（这段会被逐字喂给参谋）
#   focus          本题**应当触及**的要点关键词（用于本地自动算覆盖度，0 消耗）
#   discipline     学科方向（学科方向尚未最终确定，此处仅作标注）
#   note           备注

cases:
  - id: ip-ai-authorship
    discipline: 民法 / 知识产权
    topic: AI 生成内容是否应享有著作权
    our_side: 控方（主张：应享有）
    opponent_text: >-
      著作权法只保护自然人的智力成果，AI 不是人，所以 AI 生成内容不应享有著作权。
      而且如果给 AI 生成物赋权，会稀释人类创作者的劳动价值。
    focus: [法人作品, 独创性, 主体拟制, 目的解释, 激励]
    note: 争点在"主体资格"与"独创性标准"，解释方法应有文义 vs 目的之争

  - id: crim-self-defense
    discipline: 刑法
    topic: 本案中甲的行为构成正当防卫
    our_side: 辩方（主张：构成正当防卫）
    opponent_text: >-
      甲在对方已经停止攻击、转身离开之后才出手，明显不具备防卫的时间条件，
      应当认定为事后防卫，构成故意伤害。
    focus: [不法侵害, 正在进行, 时间条件, 防卫意图, 三阶层]
    note: 争点在"正在进行"的判断标准；刑法方向应走三阶层而非请求权基础

  - id: privacy-face-recognition
    discipline: 民法 / 个人信息保护
    topic: 商场未经同意使用人脸识别是否合法
    our_side: 原告（主张：不合法）
    opponent_text: >-
      人脸信息是公开的，顾客走进商场就等于默示同意被拍摄，
      而且商场是为了安保需要，属于合理使用，不构成侵权。
    focus: [敏感个人信息, 单独同意, 告知义务, 比例原则, 必要性]
    note: 争点在"默示同意"能否满足敏感个人信息的单独同意要求

  - id: juris-ai-liability
    discipline: 法理 / 侵权责任
    topic: AI 致害的责任应由谁承担
    our_side: 正方（主张：应由使用者承担）
    opponent_text: >-
      损害是算法自主决策造成的，使用者既无法预见也无法控制，
      让他承担责任不符合过错责任原则，应当由开发者承担。
    focus: [过错, 危险责任, 风险分配, 控制力, 报偿理论]
    note: 争点在过错与危险责任的边界；不涉及具体法条，考验法理层面的论证
